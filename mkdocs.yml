# 프로젝트 정보
site_name: Claude Code 온보딩 가이드
site_description: AI 페어 프로그래밍으로 개발 생산성을 높이기 위한 팀 온보딩 문서
site_author: CLOBOT
site_url: https://kwag93.github.io/claude-code-onboarding-site/

# 저장소 정보
repo_name: claude-code-onboarding-site
repo_url: https://github.com/kwag93/claude-code-onboarding-site
edit_uri: edit/main/docs/

# 테마 설정
theme:
  name: material
  custom_dir: overrides
  language: ko
  palette:
    # 라이트 모드
    - scheme: default
      primary: custom
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: 다크 모드로 전환
    # 다크 모드
    - scheme: slate
      primary: custom
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: 라이트 모드로 전환
  font:
    text: Noto Sans KR
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

# 네비게이션
nav:
  - 홈: index.md
  - 시작하기:
      - 빠른 시작: 01-quick-start.md
      - 프로젝트 초기화: 14-init-guide.md
      - AI 마인드셋: 02-ai-mindset.md
  - 실무 가이드:
      - 워크플로우: 03-workflows.md
      - 모범 사례: 21-best-practices.md
      - CLAUDE.md 마스터하기: 15-claude-md-mastery.md
      - Hooks 실전 가이드: 16-hooks-practical.md
      - 팀 세션 가이드: 06-agent-teams-cowork.md
      - 코워크 가이드: 19-cowork-guide.md
      - 리모트 컨트롤: 22-remote-control.md
      - 왜 CLI인가: 07-why-cli.md
      - OMC 활용 가이드: 08-omc-guide.md
      - Superpowers 활용 가이드: 32-superpowers-guide.md
      - 멀티 모델 협업: 29-multi-model.md
      - 자동화의 힘: 09-automation.md
      - GitLab CI/CD: 24-gitlab-cicd.md
      - 파워 유저 70가지 팁: 13-power-user-tips.md
  - 확장하기:
      - 확장 기능 개요: 20-features-overview.md
      - 학습 기능 활용하기: 30-learning-features.md
      - MCP 생태계: 10-mcp-ecosystem.md
      - 스킬과 플러그인: 11-skills-plugins.md
      - 직접 만들기: 31-build-your-own.md
      - Channels: 28-channels.md
      - Chrome 확장 프로그램: 23-chrome-extension.md
      - Status Line 커스터마이징: 25-statusline-guide.md
      - 키보드 단축키 커스터마이징: 26-keybindings-guide.md
      - 보이스 모드: 27-voice-mode.md
      - 추천 리소스: 18-resources.md
  - 철학:
      - AI와 함께 일하는 방법: 12-ai-work-philosophy.md
      - 흔한 실수 피하기: 17-anti-patterns.md
      - 나아가는 방법: 04-evolving.md
      - 요청하는 방법: 05-prompt-tips.md
  - 업데이트:
      - 문서 업데이트 내역: 99-release-notes.md

# 확장 기능
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3

# 플러그인
plugins:
  - search:
      lang:
        - ko
        - en

# 추가 CSS
extra_css:
  - stylesheets/extra.css

# 추가 설정
extra:
  analytics:
    provider: google
    property: G-V8LTX9P6WX
    feedback:
      title: 이 문서가 도움이 되었나요?
      ratings:
        - icon: material/emoticon-happy-outline
          name: 도움이 됐어요
          data: 1
          note: 감사합니다! 피드백이 문서 개선에 도움이 됩니다.
        - icon: material/emoticon-sad-outline
          name: 개선이 필요해요
          data: 0
          note: 피드백 감사합니다. 어떤 부분이 부족했는지 GitHub Issue로 알려주세요.
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kwag93/claude-code-onboarding-site
  generator: false

# 저작권
copyright: Copyright &copy; 2026 CLOBOT - Claude Code Onboarding Guide
